<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Interface</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">
    <script src="socketstate.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="socket-container">

        <h1>WebSocket Interface</h1>

        <div class="socket-layout">

            <div class="socket-infobox">
                <div>
                    <h2>Socket Info</h2>
                    <p>Status: <span id="status">Disconnected</span></p>
                    <div class="socket-buttonbox">
                        <button class="socket-button" onclick="createConnection()">Create Connection</button>
                        <button class="socket-button" onclick="endConnection()">End Connection</button>
                    </div>
                </div>
                <div class="socket-connectionbox">
                    <select class="socket-select" id="socket-select">
                        <option value="none">Create a connection</option>
                    </select>
                </div>
                <div class="socket-inputbox">
                    <textarea class="socket-input" id="msg" placeholder="Type a message"></textarea>
                </div>
                <button class="socket-button" onclick="sendMessage()">Send</button>
            </div>

            <div class="socket-messagebox">
                <div class="socket-messages-header">
                    <h2>Messages</h2>
                    <div class="socket-messages-types">
                        <p class="socket-type socket-info">Info</p>
                        <p class="socket-type socket-outgoing">Outgoing</p>
                        <p class="socket-type socket-incoming">Incoming</p>
                    </div>
                </div>
                <div class="socket-messages" id="messages">
                </div>
            </div>

        </div>
    </div>
    <div class="socket-message socket-info" id="initial-message" style="display: none;">
        <p>Initial message.</p>
    </div>

    <script>
        setInterval(() => {
            render();
        }, 250);
        createConnection();
    </script>
</body>

</html>
